<!DOCTYPE html>
<html>
<body style="margin:0;padding:24px;background:#f4f4f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1d2433;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td align="center">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:8px;padding:32px;">
      <tr><td>
        <p style="font-size:16px;line-height:1.5;margin:0 0 24px;">{{.T.confirmIntro}}</p>
        <p style="margin:0 0 24px;"><a href="{{.URL}}" style="display:inline-block;background:#3b4bd8;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:6px;font-weight:600;">{{.T.confirmButton}}</a></p>
        <p style="font-size:13px;line-height:1.5;color:#5c6478;margin:0;">{{.T.confirmIgnore}}</p>
      </td></tr>
    </table>
  </td></tr></table>
</body>
</html>
